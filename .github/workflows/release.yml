name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk niusic-android-arm64-v8a-release.apk
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: niusic-android-arm64-v8a-release.apk
          body_path: CHANGELOG.md
