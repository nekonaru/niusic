name: niusic
description: Play local and online music on Android and Windows with one Flutter codebase.
publish_to: 'none'
version: 0.7.0+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  youtube_explode_dart: ^3.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
