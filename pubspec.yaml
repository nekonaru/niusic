name: niusic
description: Play local and online music on Android and Windows with one Flutter codebase.
publish_to: 'none'
version: 6.0.0+35

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  youtube_explode_dart: ^3.1.0
  http: ^1.6.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_waveform: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/niusic-mark.png
